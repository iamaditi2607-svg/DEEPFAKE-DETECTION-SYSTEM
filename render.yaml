services:
  - type: web
    name: deepshield
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    envVars:
      - key: FAKE_THRESHOLD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
